<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY" />
    
    <!-- SEO Meta 標籤 -->
    <meta name="description" content="ChequeEasy 支票易 | 企業級支票中英文大寫轉換器。零資料洩漏風險，100% 用戶端本地運算，符合 ISO 27001 資安標準，支援 PWA 離線使用。Enterprise-grade Cheque Converter with 100% client-side processing and PWA offline readiness.">
    <meta name="keywords" content="支票大寫, 支票英文大寫, Cheque Converter, Bank Code, 銀行代碼, HKMA API, PWA">
    <meta name="author" content="ChequeEasy 支票易">

    <!-- Open Graph (社交分享與 Google 預覽卡片) -->
    <meta property="og:title" content="ChequeEasy 支票易 | 企業級支票中英文大寫轉換器">
    <meta property="og:description" content="零資料洩漏風險，100% 用戶端本地運算，符合 ISO 27001 資安標準，支援 PWA 離線使用。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jackylawck.github.io/ChequeEasy/">
    <meta property="og:image" content="ChequeEasyicon-512.png">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.hkma.gov.hk;">
    <meta name="theme-color" content="#003366">
    
    <!-- PWA Manifest 與 手機主畫面圖示支援 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="ChequeEasyicon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ChequeEasy">

    <title>ChequeEasy 支票易 | 企業級支票中英文大寫轉換器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <h1>ChequeEasy 支票易</h1>
            <div class="header-right">
                <span class="security-badge" id="badgeText" data-zh="🔒 ISO 27001 資安標準 (100% 本地運算)" data-en="🔒 ISO 27001 Compliant (Local Only)">🔒 ISO 27001 資安標準 (100% 本地運算)</span>
                <button id="langToggleBtn" class="lang-btn">English</button>
            </div>
        </div>
    </header>

    <main class="app-container">
        <!-- 分頁導航 -->
        <nav class="tabs">
            <button class="tab-btn active" data-target="single-cheque" id="tabSingle" data-zh="📄 支票大寫轉換" data-en="📄 Cheque Convert">📄 支票大寫轉換</button>
            <button class="tab-btn" data-target="bank-code" id="tabBank" data-zh="🏦 認可銀行代碼 (HKMA API)" data-en="🏦 Bank Code (HKMA API)">🏦 認可銀行代碼 (HKMA API)</button>
        </nav>

        <!-- 支票大寫轉換區 -->
        <section id="single-cheque" class="tab-content active">
            <div class="input-section">
                <label for="amountInput" id="inputLabel" data-zh="請輸入阿拉伯數字：" data-en="Enter Amount (HKD):">請輸入阿拉伯數字：</label>
                <div class="input-box">
                    <input type="number" id="amountInput" placeholder="例如：123456789" step="0.01" min="0">
                    <button id="convertBtn" class="primary-btn" data-zh="轉換" data-en="Convert">轉換</button>
                </div>
            </div>

            <div class="output-group">
                <h3 id="zhTitle" data-zh="中文大寫寫法：" data-en="Amount in Chinese Words:">中文大寫寫法：</h3>
                <div class="result-box">
                    <input type="text" id="zhOutput" readonly placeholder="請先輸入阿拉伯數字，再按轉換">
                    <button class="copy-btn" id="copyZhBtn" data-zh="複製" data-en="Copy">複製</button>
                </div>
            </div>

            <div class="output-group">
                <h3 id="enTitle" data-zh="英文大寫寫法 (English Words)：" data-en="Amount in English Words:">英文大寫寫法 (English Words)：</h3>
                <div class="result-box">
                    <input type="text" id="enOutput" readonly placeholder="Result will appear here...">
                    <button class="copy-btn" id="copyEnBtn" data-zh="複製" data-en="Copy">複製</button>
                </div>
            </div>
            
            <p class="privacy-note" id="privacyNote" data-zh="💡 提示：本工具不設後端資料庫，所有運算在瀏覽器本地完成，零資料洩漏風險。" data-en="💡 Note: Zero-data retention policy. All calculations run locally inside your browser.">💡 提示：本工具不設後端資料庫，所有運算在瀏覽器本地完成，零資料洩漏風險。</p>
        </section>

        <!-- 銀行代碼查詢區 -->
        <section id="bank-code" class="tab-content">
            <h2 id="bankTitle" data-zh="認可銀行代碼速查" data-en="Licensed Banks Directory">認可銀行代碼速查</h2>
            <button id="fetchBankBtn" class="primary-btn" data-zh="📥 連線至金管局 (HKMA) 取得最新名單" data-en="📥 Fetch Latest List from HKMA API">📥 連線至金管局 (HKMA) 取得最新名單</button>
            <div id="bankListContainer" class="bank-list"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
