<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ISO 27001 資安防護：限制第三方惡意連線 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.hkma.gov.hk;">
    <title>ChequeEasy 支票易 | 香港支票中英文大寫轉換器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <h1>ChequeEasy 支票易</h1>
            <span class="security-badge">🔒 ISO 27001 資安標準 (100% 本地運算)</span>
        </div>
    </header>

    <main class="app-container">
        <!-- 分頁導航 -->
        <nav class="tabs">
            <button class="tab-btn active" data-target="single-cheque">📄 支票大寫轉換</button>
            <button class="tab-btn" data-target="bank-code">🏦 香港銀行代碼 (HKMA API)</button>
        </nav>

        <!-- 支票大寫轉換區 -->
        <section id="single-cheque" class="tab-content active">
            <div class="input-section">
                <label for="amountInput">請輸入阿拉伯數字：</label>
                <div class="input-box">
                    <input type="number" id="amountInput" placeholder="例如：123456789" step="0.01" min="0">
                    <button id="convertBtn" class="primary-btn">轉換</button>
                </div>
            </div>

            <div class="output-group">
                <h3>中文大寫寫法：</h3>
                <div class="result-box">
                    <input type="text" id="zhOutput" readonly placeholder="請先輸入阿拉伯數字，再按轉換">
                    <button class="copy-btn" onclick="copyToClipboard('zhOutput')">複製</button>
                </div>
            </div>

            <div class="output-group">
                <h3>英文大寫寫法 (English Words)：</h3>
                <div class="result-box">
                    <input type="text" id="enOutput" readonly placeholder="Result will appear here...">
                    <button class="copy-btn" onclick="copyToClipboard('enOutput')">複製</button>
                </div>
            </div>
            
            <p class="privacy-note">💡 提示：本工具不設後端資料庫，所有運算在瀏覽器本地完成，零資料洩漏風險。</p>
        </section>

        <!-- 銀行代碼查詢區 -->
        <section id="bank-code" class="tab-content">
            <h2>香港認可銀行代碼速查</h2>
            <button id="fetchBankBtn" class="primary-btn">📥 連線至金管局 (HKMA) 取得最新名單</button>
            <div id="bankListContainer" class="bank-list"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
