<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. 站長驗證與雙語國際化 SEO 宣告 (Hreflang) -->
    <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY" />
    <link rel="canonical" href="https://jackylawck.github.io/ChequeEasy/" />
    <link rel="alternate" hreflang="zh-HK" href="https://jackylawck.github.io/ChequeEasy/" />
    <link rel="alternate" hreflang="en" href="https://jackylawck.github.io/ChequeEasy/" />
    <link rel="alternate" hreflang="x-default" href="https://jackylawck.github.io/ChequeEasy/" />

    <!-- 2. 外部 API 效能預連線 (Preconnect HKMA Open API) -->
    <link rel="preconnect" href="https://api.hkma.gov.hk" crossorigin>
    <link rel="dns-prefetch" href="https://api.hkma.gov.hk">

    <!-- 3. 中英文雙語 SEO 核心 Meta 標籤 -->
    <title>ChequeEasy 支票易 | 企業級支票中英文大寫轉換器 (Enterprise Cheque Converter)</title>
    <meta name="description" content="ChequeEasy 支票易為企業級支票中英文大寫轉換器。零資料洩漏風險，100% 用戶端本地運算，符合 ISO 27001 資安標準，支援 PWA 離線使用與金管局認可銀行代碼速查。Enterprise-grade bilingual cheque converter with 100% client-side calculation and PWA offline readiness.">
    <meta name="keywords" content="支票大寫, 支票英文大寫, 支票中文大寫, Cheque Converter, Cheque Amount in Words, Bank Code, 銀行代碼, HKMA API, PWA, 離線工具, ISO 27001">
    <meta name="author" content="羅子淇 (Jacky Law)">
    <meta name="copyright" content="ChequeEasy 支票易">
    <meta name="robots" content="index, follow, max-image-preview:large">

    <!-- 4. Open Graph (社群分享預覽卡片) -->
    <meta property="og:title" content="ChequeEasy 支票易 | 企業級支票中英文大寫轉換器">
    <meta property="og:description" content="零資料洩漏風險，100% 用戶端本地運算，符合 ISO 27001 資安標準，支援 PWA 離線使用。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jackylawck.github.io/ChequeEasy/">
    <meta property="og:image" content="https://jackylawck.github.io/ChequeEasy/ChequeEasyicon-512.png">
    <meta property="og:site_name" content="ChequeEasy 支票易">
    <meta property="og:locale" content="zh_HK">
    <meta property="og:locale:alternate" content="en_US">

    <!-- 5. Twitter Card (X/Twitter 社交預覽) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ChequeEasy 支票易 | 企業級支票中英文大寫轉換器">
    <meta name="twitter:description" content="零資料洩漏風險，100% 用戶端本地運算，符合 ISO 27001 資安標準，支援 PWA 離線使用。">
    <meta name="twitter:image" content="https://jackylawck.github.io/ChequeEasy/ChequeEasyicon-512.png">

    <!-- 6. 銀行級高嚴格 CSP (已移除 unsafe-inline，全面防堵 XSS) 與主題顏色 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' https://api.hkma.gov.hk; img-src 'self' data:; font-src 'self';">
    <meta name="theme-color" content="#003366">
    
    <!-- 7. PWA Manifest 與 手機主畫面圖示支援 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="ChequeEasyicon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ChequeEasy">

    <!-- 8. Google 演算法 E-E-A-T 識別 (低調保留 Schema) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ChequeEasy 支票易",
      "alternateName": "ChequeEasy Bilingual Cheque Converter",
      "url": "https://jackylawck.github.io/ChequeEasy/",
      "description": "企業級支票中英文大寫轉換器與認可銀行代碼速查工具。零資料洩漏風險，100% 用戶端本地運算，符合 ISO 27001 資安標準，支援 PWA 離線使用。",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "All",
      "inLanguage": ["zh-HK", "en"],
      "author": {
        "@type": "Person",
        "name": "羅子淇",
        "alternateName": "Jacky Law",
        "url": "https://jackylawck.github.io/jackylawck"
      },
      "creator": {
        "@type": "Person",
        "name": "羅子淇 (Jacky Law)",
        "url": "https://jackylawck.github.io/jackylawck"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "HKD"
      },
      "featureList": [
        "100% 本地運算，零資料洩漏 (100% Client-side, Zero Data Retention)",
        "ISO 27001 資安標準 (ISO 27001 Compliant)",
        "支援中文與英文支票金額大寫即時轉換 (Bilingual Cheque Word Conversion)",
        "連線金管局 (HKMA) API 認可銀行代碼查詢 (HKMA Bank Directory API)",
        "PWA 離線支援 (PWA Offline Ready)"
      ]
    }
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <h1 data-zh="ChequeEasy 支票易" data-en="ChequeEasy">ChequeEasy 支票易</h1>
            <div class="header-right">
                <span class="security-badge" id="badgeText" data-zh="🔒 ISO 27001 資安標準 (100% 本地運算)" data-en="🔒 ISO 27001 Compliant (Local Only)">🔒 ISO 27001 資安標準 (100% 本地運算)</span>
                <button id="langToggleBtn" class="lang-btn" aria-label="切換語言 Switch Language">English</button>
            </div>
        </div>
    </header>

    <main class="app-container">
        <!-- 分頁導航 (符合 WAI-ARIA 鍵盤導航規範) -->
        <nav class="tabs" role="tablist" aria-label="功能選單">
            <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="cheque-converter" id="tabSingle" data-target="cheque-converter" data-zh="📄 支票大寫轉換" data-en="📄 Cheque Convert">📄 支票大寫轉換</button>
            <button class="tab-btn" role="tab" aria-selected="false" aria-controls="bank-directory" id="tabBank" data-target="bank-directory" data-zh="🏦 認可銀行代碼 (HKMA API)" data-en="🏦 Bank Code (HKMA API)">🏦 認可銀行代碼 (HKMA API)</button>
        </nav>

        <!-- 支票大寫轉換區 -->
        <section id="cheque-converter" class="tab-content active" role="tabpanel" aria-labelledby="tabSingle">
            <article class="input-section">
                <label for="amountInput" id="inputLabel" data-zh="請輸入阿拉伯數字：" data-en="Enter Amount (HKD):">請輸入阿拉伯數字：</label>
                <div class="input-box">
                    <input type="text" id="amountInput" inputmode="decimal" pattern="[0-9]*\.?[0-9]{0,2}" placeholder="例如：123456789.50" autocomplete="off" aria-label="支票金額">
                    <button id="convertBtn" class="primary-btn" data-zh="轉換" data-en="Convert">轉換</button>
                </div>
            </article>

            <article class="output-group">
                <h2 id="zhTitle" class="section-subtitle" data-zh="中文大寫寫法：" data-en="Amount in Chinese Words:">中文大寫寫法：</h2>
                <div class="result-box">
                    <input type="text" id="zhOutput" readonly placeholder="請先輸入阿拉伯數字，再按轉換" aria-label="中文大寫結果">
                    <button class="copy-btn" id="copyZhBtn" data-zh="複製" data-en="Copy" aria-label="複製中文大寫">複製</button>
                </div>
            </article>

            <article class="output-group">
                <h2 id="enTitle" class="section-subtitle" data-zh="英文大寫寫法 (English Words)：" data-en="Amount in English Words:">英文大寫寫法 (English Words)：</h2>
                <div class="result-box">
                    <input type="text" id="enOutput" readonly placeholder="Result will appear here..." aria-label="英文大寫結果">
                    <button class="copy-btn" id="copyEnBtn" data-zh="複製" data-en="Copy" aria-label="複製英文大寫">複製</button>
                </div>
            </article>
            
            <p class="privacy-note" id="privacyNote" data-zh="💡 提示：本工具不設後端資料庫，所有運算在瀏覽器本地完成，零資料洩漏風險。" data-en="💡 Note: Zero-data retention policy. All calculations run locally inside your browser.">💡 提示：本工具不設後端資料庫，所有運算在瀏覽器本地完成，零資料洩漏風險。</p>
        </section>

        <!-- 銀行代碼查詢區 -->
        <section id="bank-directory" class="tab-content" role="tabpanel" aria-labelledby="tabBank">
            <h2 id="bankTitle" data-zh="認可機構與銀行代碼速查" data-en="Licensed Banks & Institutions Directory">認可機構與銀行代碼速查</h2>
            <div class="bank-controls">
                <input type="text" id="bankSearchInput" placeholder="🔍 搜尋銀行名稱或代碼..." aria-label="搜尋銀行名稱或代碼">
                <button id="fetchBankBtn" class="primary-btn" data-zh="🔄 重新整理名單" data-en="🔄 Refresh Directory">🔄 重新整理名單</button>
            </div>
            <div id="bankListContainer" class="bank-list" role="region" aria-live="polite"></div>
        </section>
    </main>

    <!-- 頁尾合規聲明連結 (樣式已提取至外部 class，避免內聯) -->
    <footer class="app-footer">
        <p>
            <a href="https://github.com/jackylawck/ChequeEasy/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer">
                🔒 Privacy, AI Compliance & Legal Statement (隱私與 AI 合規聲明)
            </a>
        </p>
    </footer>

    <!-- 延遲載入 JavaScript，優化渲染效能 -->
    <script src="app.js" defer></script>
</body>
</html>
